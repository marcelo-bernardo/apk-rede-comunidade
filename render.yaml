# Blueprint do Render: cria só a API. O banco é o PostgreSQL do Neon.
# No painel do Render: New > Blueprint > escolha este repositório.
services:
  - type: web
    name: rede-comunidade-api
    runtime: docker
    rootDir: backend
    # Caminhos relativos ao rootDir: usa backend/Dockerfile com backend/ como contexto.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: virginia # mesma região do banco no Neon (AWS us-east-1)
    plan: free
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # Connection string do Neon (com ?sslmode=require). Pedida na criação do Blueprint.
      - key: DATABASE_URL
        sync: false
